<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e25c40"/>
      <stop offset="50%" stop-color="#e0a96d"/>
      <stop offset="100%" stop-color="#008080"/>
    </linearGradient>
  </defs>

  <!-- Banner Background -->
  <rect width="480" height="120" rx="16" fill="#161514"/>

  <!-- Icon Artboard -->
  <rect x="12" y="12" width="96" height="96" rx="20" fill="#211f1e" stroke="#33302e" stroke-width="1.5"/>

  <!-- Icon -->
  <g transform="translate(28, 28) scale(2)">
    <!-- Table A (Terracotta) -->
    <rect x="3" y="5" width="11" height="9" rx="1.5" fill="#e25c40"/>
    <rect x="5" y="8" width="7" height="1.5" rx="0.5" fill="#fcfbfa" opacity="0.9"/>
    <rect x="5" y="11" width="5" height="1.5" rx="0.5" fill="#fcfbfa" opacity="0.6"/>

    <!-- Table B (Slate Gray) -->
    <rect x="18" y="18" width="11" height="9" rx="1.5" fill="#5a6b7c"/>
    <rect x="20" y="21" width="7" height="1.5" rx="0.5" fill="#fcfbfa" opacity="0.9"/>
    <rect x="20" y="24" width="5" height="1.5" rx="0.5" fill="#fcfbfa" opacity="0.6"/>

    <!-- Connection Line (Teal) -->
    <path d="M 14,9.5 C 20,9.5 12,22.5 18,22.5" fill="none" stroke="#008080" stroke-width="2" stroke-linecap="round"/>
    <!-- Arrow Head -->
    <polygon points="15,20.5 18,22.5 15,24.5" fill="#008080"/>
  </g>

  <!-- Title Text (matching header gradient: terracotta → gold → teal) -->
  <text x="132" y="55" fill="url(#brandGradient)" font-family="'Source Sans 3', 'Inter', sans-serif" font-size="32" font-weight="900" letter-spacing="-0.02em">QueryLens</text>

  <!-- Tagline -->
  <text x="134" y="80" fill="#a8a29e" font-family="'Source Sans 3', 'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">
    ORACLE SQL QUERY VISUALIZER
  </text>

  <!-- Decorative Dots -->
  <circle cx="138" cy="100" r="2.5" fill="#e25c40"/>
  <circle cx="148" cy="100" r="2.5" fill="#5a6b7c"/>
  <circle cx="158" cy="100" r="2.5" fill="#008080"/>
  <circle cx="168" cy="100" r="2.5" fill="#e0a96d"/>
</svg>
