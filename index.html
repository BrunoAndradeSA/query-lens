<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QueryLens - Oracle Query Diagram</title>
  <meta name="description" content="Visualize Oracle SQL query relationships as interactive diagrams with QueryLens">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#161514" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#fcfbfa" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="QueryLens">
  
  <!-- Typography & Styling -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Source+Sans+3:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css">

  <meta name="color-scheme" content="dark light">
  <script>
    {
      const theme = localStorage.getItem('querylens_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      document.querySelector('meta[name="color-scheme"]').content = theme === 'dark' ? 'dark' : 'light';
    }
  </script>

  <link rel="stylesheet" data-name="vs/editor/editor.main"
        href="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/editor/editor.main.min.css">

  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.28.1/dist/cytoscape.min.js"></script>

  <script>
    window.MonacoEnvironment = {
      baseUrl: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min',
      getWorker: function () {
        var path = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/base/worker/workerMain.js';
        var baseUrl = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min';
        return fetch(path).then(function (res) { return res.text(); })
          .then(function (code) {
            var setup = 'self.MonacoEnvironment={baseUrl:"' + baseUrl + '"};';
            return new Worker(URL.createObjectURL(new Blob([setup + code], { type: 'application/javascript' })));
          });
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
  <script>
    window.__monacoReady = new Promise(function (resolve) {
      require.config({
        paths: {
          vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs'
        }
      });
      require(['vs/editor/editor.main'], function () {
        resolve();
      });
    });
  </script>
</head>
<body>
  <div id="app">
    <div class="top-bar">
      <div class="brand">
        <svg viewBox="0 0 32 32" width="28" height="28">
          <!-- Table A (Terracotta) -->
          <rect x="3" y="5" width="11" height="9" rx="1.5" fill="var(--logo-table-1, #e25c40)"/>
          <rect x="5" y="8" width="7" height="1.5" rx="0.5" fill="#fcfbfa" opacity="0.9"/>
          <rect x="5" y="11" width="5" height="1.5" rx="0.5" fill="#fcfbfa" opacity="0.6"/>

          <!-- Table B (Slate Gray) -->
          <rect x="18" y="18" width="11" height="9" rx="1.5" fill="var(--logo-table-2, #5a6b7c)"/>
          <rect x="20" y="21" width="7" height="1.5" rx="0.5" fill="#fcfbfa" opacity="0.9"/>
          <rect x="20" y="24" width="5" height="1.5" rx="0.5" fill="#fcfbfa" opacity="0.6"/>

          <!-- Connection Line (Teal) -->
          <path d="M 14,9.5 C 20,9.5 12,22.5 18,22.5" fill="none" stroke="var(--logo-link, #008080)" stroke-width="2" stroke-linecap="round"/>
          <!-- Arrow Head -->
          <polygon points="15,20.5 18,22.5 15,24.5" fill="var(--logo-link, #008080)"/>
        </svg>
        <span>QueryLens</span>
      </div>
      <a href="https://github.com/BrunoAndradeSA" target="_blank" rel="noopener noreferrer" class="github-center-btn" title="GitHub">
        <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
        </svg>
      </a>
      <div class="top-bar-right">
        <span class="version-tag">Oracle Query Diagram Tool v1.0</span>
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle theme" title="Toggle Light/Dark Theme">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </div>

    <div id="toolbar-area"></div>

    <div class="main-container">
      <div class="panel panel-left">
        <div class="panel-header">
          <span>SQL Editor</span>
          <div class="panel-actions">
            <span class="badge">Oracle</span>
          </div>
        </div>
        <div id="editor-container" class="editor-container"></div>
      </div>

      <div id="splitter" class="splitter"></div>

      <div class="panel panel-right">
        <div class="panel-header">
          <span>Relationship Diagram</span>
          <div class="panel-actions">
            <span class="badge" id="node-count">0 nodes</span>
          </div>
        </div>
        <div id="cost-panel" class="cost-panel" style="display:none">
          <div class="cost-header">
            <button class="cost-toggle" id="cost-toggle" title="Toggle cost details">
              <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
                <path d="M3 1l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
            <span class="cost-title">Query Cost</span>
            <span class="cost-total">Cost: <strong id="cost-total">0</strong></span>
          </div>
          <div class="cost-body" id="cost-body">
            <div class="cost-bar">
              <div class="cost-bar-bg">
                <div class="cost-bar-fill" id="cost-bar-value"></div>
              </div>
              <div class="cost-bar-max" id="cost-bar-max"></div>
            </div>
            <div class="cost-breakdown" id="cost-breakdown"></div>
          </div>
        </div>
        <div class="graph-container">
          <div id="graph"></div>
          <div class="empty-state" id="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <path d="M21 15l-5-5L5 21"/>
            </svg>
            <h3>No Diagram Yet</h3>
            <p>Write or paste an Oracle SQL query in the editor to see its relationship diagram.</p>
            <p style="margin-top:8px;font-size:11px;color:#555">
              Press <kbd style="background:#333;padding:2px 6px;border-radius:3px;border:1px solid #555">Ctrl+Enter</kbd> to run
            </p>
          </div>
        </div>
      </div>
    </div>

    <div class="status-bar">
      <div class="status-left">
        <span class="status-item" id="status-indicator">
          <span class="status-dot ready"></span>
          <span class="status-label">Ready</span>
        </span>
        <span class="status-item" id="status-tables">Tables: 0</span>
        <span class="status-item" id="status-joins">Relations: 0</span>
      </div>
      <div class="status-right">
        <span class="status-item">Cytoscape.js</span>
        <span class="status-item">Monaco Editor</span>
      </div>
    </div>
  </div>

  <script type="module" src="scripts/app.js?v=2"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').then((reg) => {
        reg.addEventListener('updatefound', () => {
          const newSW = reg.installing;
          newSW.addEventListener('statechange', () => {
            if (newSW.state === 'activated' && !navigator.serviceWorker.controller) {
              console.log('[QueryLens] SW ready for offline');
            }
          });
        });
      });

      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });
    }
  </script>
</body>
</html>
